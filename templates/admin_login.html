<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bet - Admin</title>
    <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .login-box{background:#fff;border-radius:16px;padding:40px 32px;max-width:360px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.08);text-align:center;}
    .login-box h1{font-size:1.3rem;margin-bottom:6px;color:#111827;}
    .login-box p{font-size:0.8rem;color:#9ca3af;margin-bottom:24px;}
    input{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:0.95rem;margin-bottom:12px;font-family:inherit;}
    input:focus{outline:none;border-color:#4f46e5;}
    button{width:100%;padding:12px;border:none;border-radius:10px;background:#4f46e5;color:#fff;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:inherit;}
    button:hover{opacity:0.9;}
    .err{color:#ef4444;font-size:0.8rem;margin-top:8px;display:none;}
    </style>
</head>
<body>
<div class="login-box">
    <h1>🔐 Admin</h1>
    <p>Daily Bet 관리자 로그인</p>
    <form onsubmit="return doLogin()">
        <input type="text" id="adminId" placeholder="아이디" autofocus>
        <input type="password" id="pw" placeholder="비밀번호">
        <button type="submit">로그인</button>
    </form>
    <div class="err" id="err">아이디 또는 비밀번호가 틀렸습니다</div>
</div>
<script>
async function doLogin(){
    const id=document.getElementById('adminId').value;
    const pw=document.getElementById('pw').value;
    const r=await fetch('{{ prefix }}/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,password:pw})});
    const d=await r.json();
    if(d.ok){location.reload();}else{document.getElementById('err').style.display='block';}
    return false;
}
</script>
</body>
</html>
