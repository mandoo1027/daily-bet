<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bet - 오늘은 누가 쏠까?</title>
    <link rel="stylesheet" href="{{ prefix }}/static/style.css?v=2">
    <link rel="stylesheet" href="{{ prefix }}/static/games.css?v=2">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
    <style>
    .user-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 0;font-size:0.8rem;}
    .user-bar img{width:28px;height:28px;border-radius:50%;object-fit:cover;}
    .user-bar .name{font-weight:700;color:var(--primary);}
    .kakao-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:#FEE500;color:#3C1E1E;font-size:0.8rem;font-weight:700;cursor:pointer;font-family:inherit;}
    .logout-link{font-size:0.7rem;color:var(--gray-400);cursor:pointer;text-decoration:underline;}
    /* 시작 화면 */
    .start-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;}
    .start-logo{font-size:3rem;margin-bottom:16px;}
    .start-title{font-size:1.8rem;font-weight:900;color:var(--primary);margin-bottom:6px;}
    .start-sub{font-size:0.9rem;color:var(--gray-400);margin-bottom:40px;}
    .start-btn{width:100%;max-width:320px;padding:16px;border-radius:14px;border:none;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px;transition:all 0.2s;}
    .start-btn:hover{transform:translateY(-2px);}
    .start-kakao{background:#FEE500;color:#3C1E1E;}
    .start-guest{background:var(--gray-100);color:var(--gray-600);border:1px solid var(--gray-200);}
    .start-divider{display:flex;align-items:center;gap:12px;width:100%;max-width:320px;margin:8px 0;color:var(--gray-300);font-size:0.75rem;}
    .start-divider::before,.start-divider::after{content:'';flex:1;height:1px;background:var(--gray-200);}
    </style>
</head>
<body>

<!-- 시작 화면 (로그인/비회원 선택) -->
<div id="startScreen" class="start-screen">
    <div class="start-logo">🎲</div>
    <div class="start-title">Daily Bet</div>
    <div class="start-sub">오늘의 행운을 시험해보세요!</div>
    <button class="start-btn start-kakao" onclick="kakaoLogin()">🟡 카카오로 시작하기</button>
    <div class="start-divider">또는</div>
    <button class="start-btn start-guest" onclick="startAsGuest()">비회원으로 시작하기</button>
    <div style="margin-top:20px;font-size:0.7rem;color:var(--gray-300);">로그인하면 기록이 저장됩니다</div>
</div>

<!-- 메인 앱 (숨김) -->
<div class="container" id="mainApp" style="display:none;">
    <!-- 로그인 바 -->
    <div class="user-bar" id="userBar"></div>
    <header>
        <h1>Daily Bet</h1>
        <p>오늘은 누가 쏠까?</p>
    </header>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" data-tab="draw">뽑기</button>
        <button class="tab" data-tab="members">멤버</button>
        <button class="tab" data-tab="stats">통계</button>
        <button class="tab" data-tab="history">기록</button>
    </div>

    <!-- ════ Draw Panel ════ -->
    <div id="draw" class="panel active">
        <!-- Mode + Bet type selection -->
        <div class="card">
            <div class="mode-select">
                <label class="mode-radio">
                    <input type="radio" name="gameMode" value="practice" checked>
                    <span class="mode-label mode-practice">연습</span>
                </label>
                <label class="mode-radio">
                    <input type="radio" name="gameMode" value="real">
                    <span class="mode-label mode-real">실전</span>
                </label>
            </div>
            <h2>내기 종류</h2>
            <div class="draw-select">
                <button class="bet-chip active" data-bet="커피">커피</button>
                <button class="bet-chip" data-bet="점심">점심</button>
                <button class="bet-chip" data-bet="간식">간식</button>
                <input type="text" class="bet-custom" placeholder="직접입력" maxlength="10" id="betCustom">
            </div>
        </div>

        <!-- Game selection grid -->
        <div class="card">
            <h2>게임 선택</h2>
            <div class="game-grid">
                <button class="game-card" data-game="ladder">
                    <div class="game-icon">🪜</div>
                    <div class="game-name">사다리 타기</div>
                    <div class="game-desc">운명의 사다리를 타고 내려가자</div>
                </button>
                <button class="game-card" data-game="wheel">
                    <div class="game-icon">🎡</div>
                    <div class="game-name">돌림판</div>
                    <div class="game-desc">돌려돌려 럭키 휠</div>
                </button>
                <button class="game-card" data-game="bomb">
                    <div class="game-icon">💣</div>
                    <div class="game-name">폭탄 돌리기</div>
                    <div class="game-desc">복불복 시한폭탄</div>
                </button>
                <button class="game-card" data-game="card">
                    <div class="game-icon">🃏</div>
                    <div class="game-name">카드 뒤집기</div>
                    <div class="game-desc">죽음의 카드를 피해라</div>
                </button>
                <button class="game-card" data-game="box">
                    <div class="game-icon">🎁</div>
                    <div class="game-name">기프트 박스</div>
                    <div class="game-desc">랜덤 미스터리 박스</div>
                </button>
                <button class="game-card" data-game="pirate">
                    <div class="game-icon">🏴‍☠️</div>
                    <div class="game-name">해적 통아저씨</div>
                    <div class="game-desc">어디에 칼을 꽂을까</div>
                </button>
                <button class="game-card" data-game="race">
                    <div class="game-icon">🏇</div>
                    <div class="game-name">경마 레이스</div>
                    <div class="game-desc">달려라 달려!</div>
                </button>
<button class="game-card" data-game="croc">
                    <div class="game-icon">🐊</div>
                    <div class="game-name">악어 이빨</div>
                    <div class="game-desc">조심조심 이빨 누르기</div>
                </button>
                <button class="game-card" data-game="balloon">
                    <div class="game-icon">🎈</div>
                    <div class="game-name">풍선 터뜨리기</div>
                    <div class="game-desc">빵! 터지기 전에 멈춰</div>
                </button>
                <button class="game-card" data-game="dice">
                    <div class="game-icon">🎲</div>
                    <div class="game-name">주사위</div>
                    <div class="game-desc">높은 숫자가 당첨!</div>
                </button>
                <button class="game-card game-card-random" data-game="random">
                    <div class="game-icon">❓</div>
                    <div class="game-name">랜덤</div>
                    <div class="game-desc">어떤 게임이 나올까?</div>
                </button>
            </div>
        </div>

        <!-- Today's results -->
        <div class="card" id="todayCard" style="display:none">
            <h2>오늘의 결과</h2>
            <div class="today-list" id="todayList"></div>
        </div>
    </div>

    <!-- ════ Members Panel ════ -->
    <div id="members" class="panel">
        <div class="card">
            <h2>멤버 관리</h2>
            <form class="member-form" id="memberForm">
                <input type="text" placeholder="이름 입력" id="memberName" maxlength="20" required>
                <button type="submit">추가</button>
            </form>
            <div class="member-count" id="memberCount"></div>
            <ul class="member-list" id="memberList"></ul>
        </div>
    </div>

    <!-- ════ Stats Panel ════ -->
    <div id="stats" class="panel">
        <div class="card">
            <h2>월별 통계</h2>
            <div class="stats-nav">
                <button id="prevMonth">&larr;</button>
                <span class="period" id="statsPeriod"></span>
                <button id="nextMonth">&rarr;</button>
            </div>
            <div id="statsContent"></div>
            <div style="margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08); text-align:right;">
                <button onclick="resetStats()" style="padding:8px 18px; border-radius:8px; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#ef4444; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s;">
                    통계 초기화
                </button>
            </div>
        </div>
    </div>

    <!-- ════ History Panel ════ -->
    <div id="history" class="panel">
        <div class="card">
            <h2>최근 기록</h2>
            <div id="historyList"></div>
        </div>
    </div>
</div>

<!-- ════ Game Overlay ════ -->
<div class="game-overlay" id="gameOverlay">
    <div class="game-header">
        <button class="game-back" id="gameBack">&larr; 돌아가기</button>
        <span class="game-title" id="gameTitle"></span>
    </div>
    <div class="game-container" id="gameContainer"></div>
    <div class="game-footer" id="gameFooter" style="display:none;">
        <button class="game-retry-btn" id="gameRetryBtn">🔄 다시하기</button>
    </div>
</div>

<!-- ════ Result Overlay ════ -->
<div class="result-overlay" id="resultOverlay">
    <canvas id="confettiCanvas"></canvas>
    <div class="result-content">
        <div class="result-emoji" id="resultEmoji"></div>
        <div class="result-announce" id="resultAnnounce">당첨자 발표!</div>
        <img class="result-blog-img" id="resultBlogImg" src="" alt="reaction">
        <div class="result-winner" id="resultWinner"></div>
        <div class="result-bet-info" id="resultBetInfo"></div>
        <div class="result-buttons">
            <button class="result-close-btn" id="resultCloseBtn">확인</button>
            <button class="result-retry-btn" id="resultRetryBtn">다시하기</button>
        </div>
    </div>
</div>

<div class="game-setup-overlay" id="gameSetupOverlay"></div>
<div class="toast" id="toast"></div>

<script>const BASE_PATH = "{{ prefix }}";</script>
<script>
// 카카오 로그인
Kakao.init('{{ kakao_js_key }}');

function kakaoLogin(){
  var redirectUri=location.origin+BASE_PATH+'/auth/kakao/callback';
  location.href='https://kauth.kakao.com/oauth/authorize?client_id=73ca63b50b44b890e1452b8ed68d7464&redirect_uri='+encodeURIComponent(redirectUri)+'&response_type=code&scope=profile_nickname,profile_image';
}

async function startAsGuest(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('userBar').innerHTML='<span style="font-size:0.75rem;color:var(--gray-400);">비회원</span> <button class="kakao-btn" onclick="kakaoLogin()" style="font-size:0.7rem;padding:4px 10px;">🟡 로그인</button>';
  // 비회원 기본 멤버 1~4 자동 추가
  await initGuestMembers();
}

async function initGuestMembers(){
  var res=await fetch(BASE_PATH+'/api/members');
  var members=await res.json();
  if(members.length===0){
    for(var i=1;i<=4;i++){
      await fetch(BASE_PATH+'/api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:String(i)})});
    }
  }
  if(typeof loadToday==='function')loadToday();
}

async function showMain(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  // 로그인 유저: 저장된 멤버 로드 (없으면 기본 멤버 추가)
  var res=await fetch(BASE_PATH+'/api/members');
  var members=await res.json();
  if(members.length===0){
    for(var i=1;i<=4;i++){
      await fetch(BASE_PATH+'/api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:String(i)})});
    }
  }
  if(typeof loadToday==='function')loadToday();
}

function kakaoLogout(){
  fetch(BASE_PATH+'/api/auth/logout',{method:'POST'}).then(function(){
    document.getElementById('startScreen').style.display='flex';
    document.getElementById('mainApp').style.display='none';
  });
}

function checkAuth(){
  fetch(BASE_PATH+'/api/auth/me').then(function(r){return r.json();}).then(function(d){
    if(d.ok){
      showMain();
      var bar=document.getElementById('userBar');
      var img=d.user.profile_image?'<img src="'+d.user.profile_image+'" alt="">':'';
      bar.innerHTML=img+'<span class="name">'+d.user.nickname+'</span><span class="logout-link" onclick="kakaoLogout()">로그아웃</span>';
    }
  });
}
checkAuth();
</script>
<script src="{{ prefix }}/static/app.js?v=2"></script>
<script src="{{ prefix }}/static/games.js?v=2"></script>
</body>
</html>
