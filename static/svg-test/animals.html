<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경마 게임 동물 SVG 4종</title>
<style>
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; padding: 30px; margin: 0; font-family: sans-serif; color: white; }
h2 { margin-bottom: 20px; }
.animals { display: flex; gap: 50px; flex-wrap: wrap; justify-content: center; }
.animal-box { text-align: center; }
.label { font-size: 14px; color: #aaa; margin-top: 8px; }
.ground { width: 120px; height: 3px; background: #4a4a6a; border-radius: 2px; margin: 0 auto; }

/* 공통 달리기 애니메이션 */
@keyframes runFront { 0%,100%{transform:rotate(-20deg)} 50%{transform:rotate(25deg)} }
@keyframes runBack { 0%,100%{transform:rotate(20deg)} 50%{transform:rotate(-20deg)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-3px)} 75%{transform:translateY(2px)} }
@keyframes tailWag { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(15deg)} }
@keyframes headBob { 0%,100%{transform:rotate(0)} 30%{transform:rotate(-5deg)} 70%{transform:rotate(3deg)} }
@keyframes wingFlap { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-30deg)} }

.running .front-legs { animation: runFront 0.35s ease-in-out infinite; }
.running .back-legs { animation: runBack 0.35s ease-in-out infinite; }
.running .body-group { animation: bounce 0.35s ease-in-out infinite; }
.running .tail { animation: tailWag 0.4s ease-in-out infinite; }
.running .head { animation: headBob 0.35s ease-in-out infinite; }
.running .wings { animation: wingFlap 0.25s ease-in-out infinite; }
</style>
</head>
<body>
<h2>🏇 경마 게임 동물 SVG 4종 (달리기 애니메이션)</h2>
<div class="animals">

<!-- 1. 말 🐎 -->
<div class="animal-box">
<div class="running">
<svg width="100" height="85" viewBox="0 0 100 85">
  <defs><radialGradient id="hs" cx="40%" cy="30%"><stop offset="0%" stop-color="white"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs>
  <g class="tail" style="transform-origin:12px 38px"><path d="M12 38Q2 42,5 52Q8 58,6 65" stroke="#8B6914" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g class="back-legs" style="transform-origin:30px 50px">
    <line x1="28" y1="55" x2="22" y2="76" stroke="#C4943D" stroke-width="5" stroke-linecap="round"/>
    <line x1="36" y1="55" x2="32" y2="76" stroke="#D4A44D" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="21" cy="78" rx="4" ry="3" fill="#3d2b0a"/><ellipse cx="31" cy="78" rx="4" ry="3" fill="#3d2b0a"/>
  </g>
  <g class="body-group"><ellipse cx="45" cy="45" rx="28" ry="18" fill="#D4A44D"/><ellipse cx="45" cy="45" rx="28" ry="18" fill="url(#hs)" opacity="0.3"/></g>
  <g class="front-legs" style="transform-origin:62px 50px">
    <line x1="58" y1="55" x2="55" y2="76" stroke="#C4943D" stroke-width="5" stroke-linecap="round"/>
    <line x1="65" y1="55" x2="63" y2="76" stroke="#D4A44D" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="54" cy="78" rx="4" ry="3" fill="#3d2b0a"/><ellipse cx="62" cy="78" rx="4" ry="3" fill="#3d2b0a"/>
  </g>
  <g class="head" style="transform-origin:75px 32px">
    <ellipse cx="78" cy="30" rx="12" ry="15" fill="#D4A44D" transform="rotate(-15 78 30)"/>
    <polygon points="72,16 75,6 79,17" fill="#C4943D"/><polygon points="80,14 83,5 86,15" fill="#C4943D"/>
    <circle cx="82" cy="26" r="3" fill="white"/><circle cx="82" cy="26" r="1.8" fill="#2d1b00"/><circle cx="83" cy="25" r="0.7" fill="white"/>
    <ellipse cx="87" cy="34" rx="5" ry="4" fill="#C4943D"/>
    <circle cx="86" cy="33" r="1" fill="#5a3d0a"/><circle cx="89" cy="33" r="1" fill="#5a3d0a"/>
    <path d="M70 18Q65 25,68 32Q63 28,66 35" stroke="#8B6914" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
</div>
<div class="ground"></div>
<div class="label">🐎 말</div>
</div>

<!-- 2. 개 🐕 -->
<div class="animal-box">
<div class="running">
<svg width="100" height="85" viewBox="0 0 100 85">
  <g class="tail" style="transform-origin:10px 32px"><path d="M10 32Q4 25,8 18Q12 12,10 8" stroke="#8B5E3C" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g class="back-legs" style="transform-origin:28px 50px">
    <line x1="25" y1="55" x2="20" y2="76" stroke="#A0724A" stroke-width="5" stroke-linecap="round"/>
    <line x1="33" y1="55" x2="30" y2="76" stroke="#B8845A" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="19" cy="78" rx="4" ry="3" fill="#5a3d1a"/><ellipse cx="29" cy="78" rx="4" ry="3" fill="#5a3d1a"/>
  </g>
  <g class="body-group">
    <ellipse cx="45" cy="45" rx="26" ry="16" fill="#B8845A"/>
    <ellipse cx="42" cy="42" rx="10" ry="8" fill="#D4A872" opacity="0.5"/>
  </g>
  <g class="front-legs" style="transform-origin:60px 50px">
    <line x1="56" y1="55" x2="53" y2="76" stroke="#A0724A" stroke-width="5" stroke-linecap="round"/>
    <line x1="63" y1="55" x2="61" y2="76" stroke="#B8845A" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="52" cy="78" rx="4" ry="3" fill="#5a3d1a"/><ellipse cx="60" cy="78" rx="4" ry="3" fill="#5a3d1a"/>
  </g>
  <g class="head" style="transform-origin:72px 32px">
    <circle cx="75" cy="32" r="14" fill="#B8845A"/>
    <!-- 귀 (축 늘어진) -->
    <ellipse cx="65" cy="22" rx="5" ry="10" fill="#A0724A" transform="rotate(-20 65 22)"/>
    <ellipse cx="85" cy="22" rx="5" ry="10" fill="#A0724A" transform="rotate(20 85 22)"/>
    <!-- 주둥이 -->
    <ellipse cx="85" cy="36" rx="8" ry="6" fill="#D4B88A"/>
    <ellipse cx="87" cy="34" rx="3" ry="2.5" fill="#3d2b0a"/>
    <!-- 눈 -->
    <circle cx="78" cy="28" r="3.5" fill="white"/><circle cx="78" cy="28" r="2" fill="#2d1b00"/><circle cx="79" cy="27" r="0.7" fill="white"/>
    <!-- 혀 -->
    <path d="M86 40Q88 46,85 48" stroke="#E85D75" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
</div>
<div class="ground"></div>
<div class="label">🐕 개</div>
</div>

<!-- 3. 원숭이 🐵 -->
<div class="animal-box">
<div class="running">
<svg width="100" height="85" viewBox="0 0 100 85">
  <g class="tail" style="transform-origin:10px 40px"><path d="M10 40Q0 35,4 28Q8 22,5 15Q3 10,8 8" stroke="#8B6B3D" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
  <g class="back-legs" style="transform-origin:30px 52px">
    <line x1="27" y1="56" x2="22" y2="76" stroke="#A07040" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="34" y1="56" x2="30" y2="76" stroke="#B08050" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="21" cy="78" rx="4" ry="3" fill="#6b4420"/><ellipse cx="29" cy="78" rx="4" ry="3" fill="#6b4420"/>
  </g>
  <g class="body-group">
    <ellipse cx="45" cy="46" rx="24" ry="15" fill="#B08050"/>
    <ellipse cx="47" cy="46" rx="16" ry="10" fill="#D4B888"/>
  </g>
  <g class="front-legs" style="transform-origin:58px 52px">
    <line x1="55" y1="56" x2="52" y2="76" stroke="#A07040" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="62" y1="56" x2="60" y2="76" stroke="#B08050" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="51" cy="78" rx="4" ry="3" fill="#6b4420"/><ellipse cx="59" cy="78" rx="4" ry="3" fill="#6b4420"/>
  </g>
  <g class="head" style="transform-origin:72px 30px">
    <circle cx="75" cy="30" r="15" fill="#B08050"/>
    <!-- 얼굴 살색 -->
    <circle cx="77" cy="33" r="10" fill="#E8C99A"/>
    <!-- 귀 -->
    <circle cx="62" cy="25" r="6" fill="#B08050"/><circle cx="62" cy="25" r="3.5" fill="#E8C99A"/>
    <circle cx="88" cy="25" r="6" fill="#B08050"/><circle cx="88" cy="25" r="3.5" fill="#E8C99A"/>
    <!-- 눈 -->
    <circle cx="72" cy="28" r="3" fill="white"/><circle cx="72" cy="28" r="1.8" fill="#2d1b00"/><circle cx="73" cy="27" r="0.6" fill="white"/>
    <circle cx="82" cy="28" r="3" fill="white"/><circle cx="82" cy="28" r="1.8" fill="#2d1b00"/><circle cx="83" cy="27" r="0.6" fill="white"/>
    <!-- 입 -->
    <path d="M73 38Q77 42,81 38" stroke="#8B5E3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 코 -->
    <ellipse cx="77" cy="35" rx="2" ry="1.5" fill="#8B5E3C"/>
  </g>
</svg>
</div>
<div class="ground"></div>
<div class="label">🐵 원숭이</div>
</div>

<!-- 4. 닭 🐔 -->
<div class="animal-box">
<div class="running">
<svg width="100" height="85" viewBox="0 0 100 85">
  <!-- 꼬리깃 -->
  <g class="tail" style="transform-origin:15px 35px">
    <path d="M15 35Q5 28,8 20" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M15 37Q7 32,10 24" stroke="#1B5E20" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M16 33Q8 24,12 16" stroke="#388E3C" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 다리 (닭 다리는 가늘고 발톱) -->
  <g class="back-legs" style="transform-origin:40px 55px">
    <line x1="40" y1="58" x2="36" y2="74" stroke="#E8A020" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 76L36 74L34 78" stroke="#E8A020" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g class="front-legs" style="transform-origin:52px 55px">
    <line x1="52" y1="58" x2="50" y2="74" stroke="#E8A020" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 76L50 74L48 78" stroke="#E8A020" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 날개 -->
  <g class="wings" style="transform-origin:40px 42px">
    <ellipse cx="38" cy="44" rx="12" ry="8" fill="#E0E0E0" transform="rotate(-10 38 44)"/>
  </g>
  <!-- 몸통 -->
  <g class="body-group">
    <ellipse cx="48" cy="45" rx="22" ry="16" fill="white"/>
    <ellipse cx="50" cy="43" rx="14" ry="10" fill="#F5F5F5"/>
  </g>
  <!-- 머리 -->
  <g class="head" style="transform-origin:70px 30px">
    <circle cx="72" cy="32" r="12" fill="white"/>
    <!-- 벼슬 -->
    <path d="M68 20Q72 12,76 20Q73 16,70 20" fill="#EF4444"/>
    <!-- 부리 -->
    <polygon points="83,30 94,33 83,36" fill="#F59E0B"/>
    <!-- 눈 -->
    <circle cx="76" cy="29" r="3" fill="white"/><circle cx="76" cy="29" r="1.8" fill="#1a1a1a"/><circle cx="77" cy="28" r="0.6" fill="white"/>
    <!-- 육수 (턱밑) -->
    <ellipse cx="78" cy="42" rx="4" ry="5" fill="#EF4444"/>
  </g>
</svg>
</div>
<div class="ground"></div>
<div class="label">🐔 닭</div>
</div>

</div>
</body>
</html>
