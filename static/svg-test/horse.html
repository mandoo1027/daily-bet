<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐎 말 SVG 캐릭터 - 경마 게임</title>
<style>
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; color: white; }
  h2 { margin-bottom: 20px; }
  .demo-row { display: flex; gap: 40px; align-items: flex-end; margin: 20px 0; }
  .label { text-align: center; font-size: 14px; color: #aaa; margin-top: 8px; }

  /* 달리기 애니메이션 */
  @keyframes runFrontLeg {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(25deg); }
  }
  @keyframes runBackLeg {
    0%, 100% { transform: rotate(20deg); }
    50% { transform: rotate(-20deg); }
  }
  @keyframes bodyBounce {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-3px); }
    75% { transform: translateY(2px); }
  }
  @keyframes tailSwing {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes headBob {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-5deg); }
    70% { transform: rotate(3deg); }
  }

  .running #horse-front-legs { animation: runFrontLeg 0.35s ease-in-out infinite; transform-origin: 62px 50px; }
  .running #horse-back-legs { animation: runBackLeg 0.35s ease-in-out infinite; transform-origin: 30px 50px; }
  .running #horse-body-group { animation: bodyBounce 0.35s ease-in-out infinite; }
  .running #horse-tail { animation: tailSwing 0.4s ease-in-out infinite; transform-origin: 12px 38px; }
  .running #horse-head { animation: headBob 0.35s ease-in-out infinite; transform-origin: 72px 35px; }

  /* 정지 상태 */
  .idle #horse-front-legs, .idle #horse-back-legs, .idle #horse-body-group, .idle #horse-tail, .idle #horse-head {
    animation: none;
  }

  .ground { width: 300px; height: 3px; background: #4a4a6a; border-radius: 2px; margin-top: -2px; }
</style>
</head>
<body>

<h2>🐎 말 캐릭터 SVG (경마 게임용)</h2>

<div class="demo-row">
  <!-- 정지 상태 -->
  <div>
    <div class="idle">
      <svg width="100" height="90" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <!-- 꼬리 -->
        <g id="horse-tail-idle">
          <path d="M12 38 Q2 42, 5 52 Q8 58, 6 65" stroke="#8B6914" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <!-- 뒷다리 -->
        <g id="horse-back-legs-idle">
          <line x1="28" y1="55" x2="22" y2="78" stroke="#C4943D" stroke-width="5" stroke-linecap="round"/>
          <line x1="36" y1="55" x2="32" y2="78" stroke="#D4A44D" stroke-width="5" stroke-linecap="round"/>
          <!-- 발굽 -->
          <ellipse cx="21" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
          <ellipse cx="31" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
        </g>
        <!-- 몸통 -->
        <g id="horse-body-idle">
          <ellipse cx="45" cy="45" rx="28" ry="18" fill="#D4A44D"/>
          <ellipse cx="45" cy="45" rx="28" ry="18" fill="url(#horseShine)" opacity="0.3"/>
        </g>
        <!-- 앞다리 -->
        <g id="horse-front-legs-idle">
          <line x1="58" y1="55" x2="55" y2="78" stroke="#C4943D" stroke-width="5" stroke-linecap="round"/>
          <line x1="65" y1="55" x2="63" y2="78" stroke="#D4A44D" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="54" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
          <ellipse cx="62" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
        </g>
        <!-- 머리 -->
        <g id="horse-head-idle">
          <ellipse cx="78" cy="30" rx="12" ry="15" fill="#D4A44D" transform="rotate(-15 78 30)"/>
          <!-- 귀 -->
          <polygon points="72,16 75,6 79,17" fill="#C4943D"/>
          <polygon points="80,14 83,5 86,15" fill="#C4943D"/>
          <!-- 눈 -->
          <circle cx="82" cy="26" r="3" fill="white"/>
          <circle cx="82" cy="26" r="1.8" fill="#2d1b00"/>
          <circle cx="83" cy="25" r="0.7" fill="white"/>
          <!-- 코 -->
          <ellipse cx="87" cy="34" rx="5" ry="4" fill="#C4943D"/>
          <circle cx="86" cy="33" r="1" fill="#5a3d0a"/>
          <circle cx="89" cy="33" r="1" fill="#5a3d0a"/>
          <!-- 갈기 -->
          <path d="M70 18 Q65 25, 68 32 Q63 28, 66 35" stroke="#8B6914" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
        <defs>
          <radialGradient id="horseShine" cx="40%" cy="30%">
            <stop offset="0%" stop-color="white"/>
            <stop offset="100%" stop-color="transparent"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <div class="ground"></div>
    <div class="label">정지 상태</div>
  </div>

  <!-- 달리기 상태 -->
  <div>
    <div class="running">
      <svg width="100" height="90" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="horseShine2" cx="40%" cy="30%">
            <stop offset="0%" stop-color="white"/>
            <stop offset="100%" stop-color="transparent"/>
          </radialGradient>
        </defs>
        <!-- 꼬리 -->
        <g id="horse-tail">
          <path d="M12 38 Q2 42, 5 52 Q8 58, 6 65" stroke="#8B6914" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <!-- 뒷다리 -->
        <g id="horse-back-legs">
          <line x1="28" y1="55" x2="22" y2="78" stroke="#C4943D" stroke-width="5" stroke-linecap="round"/>
          <line x1="36" y1="55" x2="32" y2="78" stroke="#D4A44D" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="21" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
          <ellipse cx="31" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
        </g>
        <!-- 몸통 -->
        <g id="horse-body-group">
          <ellipse cx="45" cy="45" rx="28" ry="18" fill="#D4A44D"/>
          <ellipse cx="45" cy="45" rx="28" ry="18" fill="url(#horseShine2)" opacity="0.3"/>
        </g>
        <!-- 앞다리 -->
        <g id="horse-front-legs">
          <line x1="58" y1="55" x2="55" y2="78" stroke="#C4943D" stroke-width="5" stroke-linecap="round"/>
          <line x1="65" y1="55" x2="63" y2="78" stroke="#D4A44D" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="54" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
          <ellipse cx="62" cy="80" rx="4" ry="3" fill="#3d2b0a"/>
        </g>
        <!-- 머리 -->
        <g id="horse-head">
          <ellipse cx="78" cy="30" rx="12" ry="15" fill="#D4A44D" transform="rotate(-15 78 30)"/>
          <polygon points="72,16 75,6 79,17" fill="#C4943D"/>
          <polygon points="80,14 83,5 86,15" fill="#C4943D"/>
          <circle cx="82" cy="26" r="3" fill="white"/>
          <circle cx="82" cy="26" r="1.8" fill="#2d1b00"/>
          <circle cx="83" cy="25" r="0.7" fill="white"/>
          <ellipse cx="87" cy="34" rx="5" ry="4" fill="#C4943D"/>
          <circle cx="86" cy="33" r="1" fill="#5a3d0a"/>
          <circle cx="89" cy="33" r="1" fill="#5a3d0a"/>
          <path d="M70 18 Q65 25, 68 32 Q63 28, 66 35" stroke="#8B6914" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div class="ground"></div>
    <div class="label">달리기 상태</div>
  </div>
</div>

<div style="margin-top: 30px; max-width: 700px; background: #16213e; padding: 20px; border-radius: 12px; font-size: 13px; line-height: 1.8;">
  <h3 style="color: #fbbf24; margin-bottom: 10px;">📋 구조 설명</h3>
  <ul style="color: #ccc; padding-left: 20px;">
    <li><b>#horse-head</b> - 머리 (귀, 눈, 코, 갈기 포함)</li>
    <li><b>#horse-body-group</b> - 몸통</li>
    <li><b>#horse-front-legs</b> - 앞다리 2개 + 발굽</li>
    <li><b>#horse-back-legs</b> - 뒷다리 2개 + 발굽</li>
    <li><b>#horse-tail</b> - 꼬리</li>
  </ul>
  <p style="color: #aaa; margin-top: 10px;">각 파트에 id가 있어서 JS로 개별 애니메이션 제어 가능!</p>
</div>

</body>
</html>
