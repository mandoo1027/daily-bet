<style>
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0;font-family:sans-serif;color:white;}
h2{margin-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:700px;}
.box{text-align:center;background:#16213e;border-radius:12px;padding:15px 10px;}
.label{font-size:13px;color:#aaa;margin-top:6px;}
.ground{width:100px;height:2px;background:#4a4a6a;border-radius:2px;margin:0 auto;}
@keyframes runF{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(25deg)}}
@keyframes runB{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}25%{transform:translateY(-2px)}75%{transform:translateY(1px)}}
@keyframes tailW{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes wingF{0%,100%{transform:rotate(0)}50%{transform:rotate(-25deg)}}
@keyframes slither{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.r .fl{animation:runF .35s ease-in-out infinite}
.r .bl{animation:runB .35s ease-in-out infinite}
.r .bd{animation:bounce .35s ease-in-out infinite}
.r .tl{animation:tailW .4s ease-in-out infinite}
.r .wg{animation:wingF .25s ease-in-out infinite}
.r .sn{animation:slither .5s ease-in-out infinite}
</style>
</head>
